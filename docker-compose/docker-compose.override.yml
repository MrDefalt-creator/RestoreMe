# Auto-loaded by `docker compose up` for local development.
# Sets ASPNETCORE_ENVIRONMENT=Development on the backend and exposes the
# MinIO admin console. Production deployments do not load this file —
# they merge docker-compose.yml with docker-compose.prod.yml instead.
services:
  minio:
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  backend:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
