services:
  db:
    image: postgres:18.3
    container_name: restoreme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restoreme_db
      POSTGRES_USER: restoreme_user
      # Password is read from a mounted secret file, not from plain env.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persist PostgreSQL data between container restarts.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoreme_user -d restoreme_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    secrets:
      - postgres-password

  minio:
    # Pinned for reproducible deployments; bump deliberately (Dependabot
    # tracks Dockerfile images but not compose, so review this manually).
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: restoreme-minio
    restart: unless-stopped
    # MinIO API stays on 9000, admin console is exposed on 9001.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio-access-key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio-secret-key
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      # Persist object storage data between restarts.
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
    secrets:
      - minio-access-key
      - minio-secret-key

  backend:
    build:
      # Context is the repo root so the Dockerfile can reach both Backup/
      # and installers/ (the install-agent scripts are baked into wwwroot).
      context: ..
      dockerfile: Backup/Backup.Server.Api/Dockerfile
    container_name: restoreme-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Backend reads the full PostgreSQL connection string from a secret file.
      ConnectionStrings__DefaultConnection_FILE: /run/secrets/postgres-connection
      # Internal MinIO address used by the backend inside the Docker network.
      Storage__Endpoint: minio:9000
      # External storage address returned to agents in upload URLs.
      # Change this if agents must reach storage through another host, IP or proxy.
      Storage__PublicEndpoint: http://localhost:${MINIO_PORT:-9000}
      Storage__AccessKey_FILE: /run/secrets/minio-access-key
      Storage__SecretKey_FILE: /run/secrets/minio-secret-key
      Storage__BucketName: backups
      Storage__UseSsl: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      # Persist ASP.NET Core DataProtection keys so cookie tokens and any
      # future Protect/Unprotect payloads survive container recreation.
      - backend_keys:/app/keys
      # Agent binaries published by the `agent-builder` one-shot service
      # land here read-only and are served at /installers/binaries/* via
      # UseStaticFiles. The directory may be empty on first start; the
      # install-agent wizard URL still resolves, but agent binary download
      # 404s with a clear message until the builder runs at least once.
      - agent_binaries:/app/wwwroot/installers/binaries:ro
    ports:
      - "${API_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      # API waits for PostgreSQL and MinIO health checks before starting.
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    secrets:
      - postgres-connection
      - minio-access-key
      - minio-secret-key

  # One-shot agent binary publisher. Runs `dotnet publish -r <RID>` for the
  # supported targets and drops self-contained single-file binaries into the
  # shared `agent_binaries` volume. Opt-in via the `build-agents` profile so
  # it does NOT run on every `compose up`:
  #
  #     docker compose --profile build-agents up agent-builder
  #
  # Re-run whenever the agent code changes. Backend reads the volume
  # read-only and serves the binaries at /installers/binaries/* for the
  # install wizard.
  agent-builder:
    build:
      context: ..
      dockerfile: Backup/Backup.Agent.Worker/Dockerfile.builder
    container_name: restoreme-agent-builder
    profiles: ["build-agents"]
    volumes:
      - agent_binaries:/output

  # Self-backup of the control plane (see docs/DR-RUNBOOK.md). Dumps the
  # PostgreSQL metadata (pg_dump custom format) and archives the
  # DataProtection key ring into ./backups on the host every
  # BACKUP_INTERVAL_HOURS (default 24h), keeping the newest BACKUP_KEEP
  # copies (default 14). Ship ./backups off-host to survive machine loss —
  # a copy that lives next to the database it protects is only half a
  # backup. MinIO artifact data is NOT covered here (see the runbook).
  control-plane-backup:
    # Same image as `db` so pg_dump always matches the server version.
    image: postgres:18.3
    container_name: restoreme-control-plane-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/control-plane-backup.sh"]
    environment:
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./scripts/control-plane-backup.sh:/usr/local/bin/control-plane-backup.sh:ro
      - ./backups:/backups
      # Key ring is read-only here; losing it makes encrypted notification
      # settings in the restored database unreadable.
      - backend_keys:/keys:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Unhealthy once the success marker is older than two backup cycles.
      # $$ escapes compose interpolation — the arithmetic runs in the
      # container shell against the env var set above.
      test: ["CMD-SHELL", "find /backups/.last-success -mmin -$$(( $${BACKUP_INTERVAL_HOURS:-24} * 120 )) | grep -q ."]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m
    deploy:
      resources:
        limits:
          memory: 256m
    secrets:
      - postgres-password

  frontend-2:
    build:
      context: ../Frontend-2.0
      dockerfile: Dockerfile
      args:
        # These values are baked into the static Vite build at image build time.
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}
        VITE_API_MODE: ${VITE_API_MODE:-live}
    container_name: restoreme-frontend-2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
    ports:
      - "${FRONTEND_2_PORT:-5173}:80"

volumes:
  db_data:
  minio_data:
  backend_keys:
  # Populated by the `agent-builder` one-shot service; mounted read-only
  # into the backend so the install-agent wizard can serve binaries.
  agent_binaries:

# Compose would auto-create a default network anyway — this just makes the
# topology explicit. Every service joins `restoreme-internal`; inter-service
# hostnames are the service names (db, minio, backend) and resolve through
# Docker DNS, so the backend reaches MinIO as `minio:9000` regardless of
# host ports.
networks:
  default:
    name: restoreme-internal

secrets:
  postgres-password:
    file: ./secrets/postgres-password.txt
  postgres-connection:
    file: ./secrets/postgres-connection.txt
  minio-access-key:
    file: ./secrets/minio-access-key.txt
  minio-secret-key:
    file: ./secrets/minio-secret-key.txt
