name: Release agent

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag name for the release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish agent (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            asset: restoreme-agent-linux-x64
            source-suffix: ''
          - rid: linux-arm64
            asset: restoreme-agent-linux-arm64
            source-suffix: ''
          - rid: win-x64
            asset: restoreme-agent-win-x64.exe
            source-suffix: '.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (${{ matrix.rid }})
        working-directory: Backup
        run: |
          dotnet publish Backup.Agent.Worker/Backup.Agent.Worker.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            --output publish/${{ matrix.rid }}

      - name: Stage artifact
        run: |
          mkdir -p out
          cp "Backup/publish/${{ matrix.rid }}/Backup.Agent.Worker${{ matrix.source-suffix }}" "out/${{ matrix.asset }}"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts and compute checksums
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > sha256sums.txt
          ls -la

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: RestoreMe Agent ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: release-assets/*
