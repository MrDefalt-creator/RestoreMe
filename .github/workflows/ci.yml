name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, preview]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: Backup
        run: dotnet restore BackupSystem.slnx

      - name: Build
        working-directory: Backup
        run: dotnet build BackupSystem.slnx --configuration Release --no-restore

      - name: Test
        working-directory: Backup
        run: dotnet test BackupSystem.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: Backup/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: Frontend-2.0/yarn.lock

      - name: Install
        working-directory: Frontend-2.0
        run: yarn install --frozen-lockfile

      - name: Lint
        working-directory: Frontend-2.0
        run: yarn lint

      - name: Typecheck
        working-directory: Frontend-2.0
        run: yarn typecheck

      - name: Test
        working-directory: Frontend-2.0
        run: yarn test

      - name: Build
        working-directory: Frontend-2.0
        run: yarn build
